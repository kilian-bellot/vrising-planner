name: Refresh wiki data

on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download wiki and game strings
        run: python scripts/fetch_wiki.py

      - name: Build data/recipes.json
        run: python scripts/build_recipes.py

      - name: Test
        run: |
          python -m unittest discover -s tests
          node --test tests/planner.test.js

      # Only the snapshot date changed? Then there is nothing to publish.
      - name: Commit if recipes changed
        run: |
          if git diff --quiet -I '"generated"' -- data/; then
            echo "No recipe changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recipes.json
          git commit -m "Refresh wiki data"
          git push
